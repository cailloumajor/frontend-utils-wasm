[[language]]
name = "css"
roots = ["deno.json"]
language-servers = ["deno-lsp", "tailwindcss-ls"]

[[language]]
name = "json"
roots = ["deno.json"]
language-servers = ["deno-lsp"]

[[language]]
name = "javascript"
roots = ["deno.json"]
file-types = ["js", "jsx"]
language-servers = ["deno-lsp"]

[[language]]
name = "typescript"
roots = ["deno.json"]
auto-format = true
language-servers = ["deno-lsp"]

[[language]]
name = "pkl"
auto-format = true

[language-server.deno-lsp]
command = "deno"
args = ["lsp"]

[language-server.deno-lsp.config.deno]
enable = true
unstable = true

[language-server.rust-analyzer.config]
check.command = "clippy"
imports.granularity.enforce = true
imports.granularity.group = "module"
imports.prefix = "self"
